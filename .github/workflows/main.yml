name: Compilar mod
on:
  push:
    branches:
      - main
      - "fix/**"
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar texturas fotograficas
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python tools/prepare_stock_textures.py

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar Gradle 9.5.0
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 5 -fL \
            https://repo.huaweicloud.com/gradle/gradle-9.5.0-bin.zip \
            -o "$RUNNER_TEMP/gradle-9.5.0-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-9.5.0-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.5.0/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-9.5.0/bin/gradle" --version

      - name: Compilar mod
        run: gradle build --no-daemon --stacktrace

      - name: Guardar JAR compilado
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ruletita-forge-1.21.11
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
