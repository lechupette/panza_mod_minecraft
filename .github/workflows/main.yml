name: Compilar mod
on:
  push:
    branches:
      - main
      - "fix/**"
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar texturas fotograficas pixeladas
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python tools/prepare_stock_textures.py

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Compilar mod
        run: gradle build --no-daemon --stacktrace

      - name: Guardar JAR compilado
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ruletita-forge-1.21.11
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
